repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: d4acaec07ac3bc6017fba3c3b8e9810af1b615db # 0.13.1
    hooks:
      - id: uv-lock

  - repo: https://github.com/ninoseki/uv-sort
    rev: 41678d6c6a4a5c9bba4ac0af42459420f05e8e75 # v0.8.0
    hooks:
      - id: uv-sort

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # v0.17.1
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
